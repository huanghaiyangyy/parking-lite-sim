# J01 kinematic control (VehicleOptions from production avm config.yaml)
# Units: meters, seconds; angles in config are degrees.
# Pose origin: rear-axle center, vehicle / world FLU.

vehicle:
  # Retain the TX2 measurement baseline while diagnosing sensor timing.
  wheelbase_m: 2.800
  track_width_m: 1.544
  steering_ratio: 15.3
  max_steer_wheel_deg: 500
  max_road_wheel_deg: 35
  max_accel_mps2: 2.0
  max_decel_mps2: 4.0
  max_speed_mps: 5.0
  wheel_radius_m: 0.334         # wheel_diameter 668 mm
  pulse_ticks_per_wheel_rev: 96
  # MCU GetDistPerPulse R17 (TireConfig_17Inch). 19/20 inch is 0.024503408 m.
  pulse_distance_m: 0.02426745556294918
  gear_map: {D: 1, R: -1, N: 0, P: 0}

control:
  dt_s: 0.02
